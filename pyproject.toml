[project]
name = "function-x"
version = "0.1.0"
description = "Home Assistant integration that makes separately bought energy devices work together"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
